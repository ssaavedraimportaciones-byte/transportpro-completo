name: Deploy a Surge

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Desplegar solo archivos públicos
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          set -e
          if [ -z "$SURGE_TOKEN" ] || [ -z "$SURGE_LOGIN" ]; then
            echo "❌ Faltan secrets SURGE_LOGIN / SURGE_TOKEN. Configúralos en Settings → Secrets."
            exit 1
          fi

          # Publicar ÚNICAMENTE los archivos de la app.
          # Nunca desplegar el repo completo: expondría documentación
          # interna, backups y migraciones en la URL pública.
          mkdir -p dist
          cp index.html dist/index.html
          cp landing.html dist/landing.html

          npm install -g surge --no-fund --no-audit --silent
          surge dist transportpro-nuevo.surge.sh
          echo "✅ Deploy completado"

      - name: Aplicar migraciones Supabase
        env:
          DB_URL: ${{ secrets.DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "⚠️ Secret DB_URL no configurado — se omiten migraciones."
            exit 0
          fi
          which psql || sudo apt-get install -y postgresql-client -qq
          for f in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            echo "→ $f"
            psql "$DB_URL" -f "$f" --set ON_ERROR_STOP=0 2>&1 | grep -v "^NOTICE" || true
          done
          echo "✅ Migraciones listas"
